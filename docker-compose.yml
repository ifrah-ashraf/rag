version: "3.9"

# ─────────────────────────────────────────────────────────────
#  RAG Stack — React UI  |  Flask Bot  |  Qdrant
# ─────────────────────────────────────────────────────────────

services:

  # ── 1. Qdrant Vector DB ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:dev
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # HTTP / REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage        # named volume (persistent across restarts)
    restart: unless-stopped

  # ── 2. Flask Bot (RAG backend) ───────────────────────────
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: rag-bot
    ports:
      - "5000:5000"
    env_file:
      - ./bot/.env                   # loads VOYAGE_API_KEY, GROQ_API_KEY, etc.
    environment:
      - QDRANT_HOST=qdrant           # ← docker service name, NOT localhost
      - QDRANT_PORT=6333
    depends_on:
      - qdrant                       # start qdrant before bot
    restart: unless-stopped

  # ── 3. React UI (served by nginx) ───────────────────────
  rag-ui:
    build:
      context: ./rag-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/ask   # baked into the JS bundle at build time
    container_name: rag-ui
    ports:
      - "5173:5173"
    depends_on:
      - bot                          # start bot before ui (optional, purely cosmetic)
    restart: unless-stopped


volumes:
  qdrant_data:
    driver: local
